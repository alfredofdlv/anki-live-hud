[project]
name = "anki-live-hud"
version = "0.2.0rc1"
description = "A persistent, animated statistics sidebar for Anki Desktop"
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "tzdata>=2025.1"]
integration = ["aqt[qt]==26.9.3", "pillow>=11", "playwright>=1.50"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["anki: tests using a real temporary Anki collection"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
